[project]
name = "esp32-iot-integration-lab"
version = "0.2.0"
description = "Public ESP32 IoT integration lab with generic firmware and synthetic serial logs."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
